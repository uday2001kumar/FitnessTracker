{% extends 'index.html' %}
{% load static %}

{% block content %}
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
  }

  .admin-hero {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .admin-card {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 40px 30px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .admin-card h3 {
    text-align: center;
    color: #1b1b1b;
    font-size: 2rem;
    margin-bottom: 25px;
    font-weight: bold;
  }

  .admin-card label {
    font-weight: 500;
    color: #333;
    margin-bottom: 6px;
    display: block;
  }

  .admin-card input {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border-radius: 10px;
    border: 1px solid #ccd6dd;
    background-color: #f9f9f9;
    font-size: 0.95rem;
    color: #222;
    transition: all 0.3s ease-in-out;
  }

  .admin-card input:focus {
    border-color: #ff4500;
    background-color: #fff;
    outline: none;
  }

  .admin-card button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(to right, #ff4500, #ff6a00);
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .admin-card button:hover {
    background: linear-gradient(to right, #e03e00, #ff9900);
  }

  .admin-card p {
    text-align: center;
    font-size: 0.9rem;
    color: #444;
    margin-top: 12px;
  }

  .text-danger {
    color: #e74c3c;
    font-weight: 500;
    text-align: center;
    margin-top: 10px;
  }

  @media (max-width: 500px) {
    .admin-card {
      padding: 30px 20px;
    }
  }
</style>

<div class="admin-hero">
  <div class="admin-card">
    <h3>Admin Login</h3>

    {% if messages %}
      {% for i in messages %}
        <p>{{ i }}</p>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter Username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter Password" required>

      <button type="submit">Login</button>

      {% if error %}
        <p class="text-danger">{{ error }}</p>
      {% endif %}
    </form>
  </div>
</div>
{% endblock %}
