{% extends 'index.html' %}
{% load static %}

{% block content %}
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7fb;
    }

    /* Adjusted height and margin-top to avoid overlapping with navbar */
    .simple-hero {
        height: calc(100vh - 70px); /* Adjust height if your navbar is different */
        margin-top: 70px; /* Push section below navbar */
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background: url("{% static 'images/n1.avif' %}") no-repeat center center/cover;
        position: relative;
    }

    .simple-hero::before {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        
    }

    .content-box {
        position: relative;
        z-index: 2;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 50px 40px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .content-box h1 {
        font-size: 2.8rem;
        color: #1b1b1b;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .content-box p {
        font-size: 1.2rem;
        color: #333;
        margin-bottom: 30px;
    }

    .content-box a.btn {
        background: linear-gradient(to right, #ff4500, #ff6a00);
        color: #fff;
        font-weight: 600;
        padding: 12px 28px;
        font-size: 1rem;
        border-radius: 30px;
        text-decoration: none;
        border: none;
        transition: all 0.3s ease-in-out;
        display: inline-block;
    }

    .content-box a.btn:hover {
        background: linear-gradient(to right, #e03e00, #ff9900);
    }

    @media screen and (max-width: 768px) {
        .content-box h1 {
            font-size: 2rem;
        }

        .content-box p {
            font-size: 1rem;
        }
    }
</style>

<main>
    <section class="simple-hero">
        <div class="content-box">
            <h1>Track Your Fitness Journey</h1>
            <p>Stay fit and healthy by tracking your workouts and nutrition.</p>
            <a href="{% url 'signup' %}" class="btn">Get Started</a>
        </div>
    </section>
</main>
{% endblock %}
