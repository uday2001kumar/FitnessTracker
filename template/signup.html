{% extends 'index.html' %}
{% load static %}

{% block content %}
<div class="signup-wrapper">
  <form method="POST" action="{% url 'sview' %}" enctype="multipart/form-data" class="signup-form">
    {% csrf_token %}
    
    {% if messages %}
      <div class="message-wrapper">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <h2 class="form-title">Create Account</h2>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="name" required placeholder="Enter your full name">
    </div>

    <div class="form-group">
      <label>Age</label>
      <input type="number" name="age" min="1" required placeholder="Enter your age">
    </div>

    <div class="form-group">
      <label>Gender</label>
      <select name="gender" required>
        <option value="" disabled selected>Select your gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Date of Birth</label>
      <input type="date" name="dob" required>
    </div>

    <div class="form-group">
      <label>Height (cm)</label>
      <input type="number" name="height" min="50" required placeholder="Enter height in cm">
    </div>

    <div class="form-group">
      <label>Weight (kg)</label>
      <input type="number" name="weight" min="20" required placeholder="Enter weight in kg">
    </div>

    <div class="form-group">
      <label>Fitness Level</label>
      <select name="fitness_level" required>
        <option value="">Select Level</option>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>
      </select>
    </div>

    <div class="form-group">
      <label>Profile Photo</label>
      <input type="file" name="photo" accept="image/*" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required placeholder="Enter your email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required placeholder="Create a password">
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" name="confirm_password" required placeholder="Confirm your password">
    </div>

    <button type="submit">Sign Up</button>

    <p class="text-link">Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </form>
</div>

<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to right, #e3f2fd, #f1f8e9);
    font-family: 'Segoe UI', sans-serif;
  }

  .signup-wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
  }

  .signup-form {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    padding: 40px 35px;
    border-radius: 18px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    margin: 100px;
  }

  .form-title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: #0d2f6a;
    margin-bottom: 25px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    background: #f9f9f9;
    font-size: 0.95rem;
    transition: 0.3s ease;
  }

  .form-group input:focus,
  .form-group select:focus {
    border-color: #00bcd4;
    background-color: #fff;
    outline: none;
  }

  button {
    width: 100%;
    background: #00bcd4;
    color: white;
    padding: 12px;
    font-weight: 600;
    border-radius: 30px;
    border: none;
    transition: 0.3s;
    font-size: 1rem;
  }

  button:hover {
    background: #0097a7;
  }

  .text-link {
    text-align: center;
    margin-top: 15px;
    font-size: 0.95rem;
  }

  .text-link a {
    color: #007bff;
    font-weight: 500;
    text-decoration: none;
  }

  .text-link a:hover {
    text-decoration: underline;
  }

  .alert {
    text-align: center;
    font-size: 0.95rem;
    margin-bottom: 15px;
    font-weight: 500;
  }

  @media (max-width: 600px) {
    .signup-form {
      padding: 30px 20px;
    }
  }
</style>
{% endblock %}
