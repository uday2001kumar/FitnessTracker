{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Modern CSS Styling -->
    <style>
        :root {
            --primary-color: #ff4500;
            --text-color: #ffffff;
            --dark-bg: #121212;
            --highlight: #ffcc00;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f5f7fa;
            color: #111;
        }

        /* Navbar */
        .navbar {
           background-color: #003366;

            padding: 1rem 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .navbar-toggler-icon {
            background-color: var(--highlight);
        }

        .navbar-nav .nav-link {
            color: var(--text-color) !important;
            font-weight: 500;
            font-size: 1rem;
            margin-left: 20px;
            transition: 0.3s ease-in-out;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            color: var(--primary-color) !important;
            text-decoration: underline;
        }

        /* Hero section placeholder (optional for home) */
        .hero {
            background: url("{% static 'images/img7.webp' %}") no-repeat center center/cover;
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        .hero h4 {
            color: var(--highlight);
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .btn-modern {
            background-color: var(--primary-color);
            color: #fff;
            border-radius: 30px;
            padding: 12px 30px;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            transition: all 0.3s ease-in-out;
        }

        .btn-modern:hover {
            background-color: #e03e00;
        }

        /* Section Titles */
        .section-title {
            text-align: center;
            padding: 60px 20px 30px;
            font-size: 2.2rem;
            font-weight: bold;
            color: #1b1b1b;
        }

        .section-title .highlight {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#">FITNESS TRACKER</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'adminlogin' %}">Admin Login</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">User Login</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'signup' %}">Signup</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Dynamic Page Content -->
{% block content %}
{% endblock %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
