{% extends 'index.html' %}
{% load static %}
{% block content %}

<style>
    body {
        margin: 0;
        padding: 0;
        background: #f4f7fb;
        font-family: 'Segoe UI', sans-serif;
    }

    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 16px;
        padding: 40px 35px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        max-width: 420px;
        width: 100%;
        transition: all 0.3s ease;
        margin-top: 60px;
    }

    .login-card h2 {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 25px;
        font-weight: 700;
        color: #1b1b1b;
    }

    .login-card label {
        display: block;
        font-weight: 500;
        margin-bottom: 6px;
        font-size: 0.95rem;
        color: #333;
    }

    .login-card input {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border-radius: 10px;
        border: 1px solid #ccd6dd;
        font-size: 0.95rem;
        color: #222;
        background-color: #f9f9f9;
        transition: border-color 0.3s, background-color 0.3s;
    }

    .login-card input:focus {
        border-color: #ff4500;
        background-color: #ffffff;
        outline: none;
    }

    .login-card button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(to right, #ff4500, #ff6a00);
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.3s;
    }

    .login-card button:hover {
        background: linear-gradient(to right, #e03e00, #ff9900);
    }

    .login-card p {
        text-align: center;
        font-size: 0.9rem;
        color: #555;
        margin: 10px 0;
    }

    .login-card a {
        color: #ff4500;
        text-decoration: none;
        font-weight: 500;
    }

    .login-card a:hover {
        text-decoration: underline;
    }

    .error-msg {
        color: #e74c3c;
        font-weight: 500;
        text-align: center;
        margin-bottom: 15px;
    }

    @media (max-width: 500px) {
        .login-card {
            padding: 30px 20px;
        }
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <h2>Login</h2>
        <form method="POST">
            {% csrf_token %}
            {% if msg %}
            <p class="error-msg">{{ msg }}</p>
            {% endif %}
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Login</button>
            <p>Don't have an account? <a href="{% url 'signup' %}">Signup</a></p>
            <p><a href="{% url 'forget_Password' %}">Forgot Password?</a></p>
        </form>
    </div>
</div>

{% endblock %}
